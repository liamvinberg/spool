name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    # macOS: the suite is macOS-validated only, and macOS is the platform
    # spool targets first (launchd autostart, OS Trash, install-as-app).
    runs-on: macos-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install chromium-headless-shell
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
