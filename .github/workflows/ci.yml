name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    # Linux: the suite is portable, and macOS bills at roughly ten times the
    # rate. The four darwin-only tests self-skip here; `darwin-gates` and the
    # release gate in publish.yml are where they run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # --with-deps: the browser tests launch headless-shell, and the runner
      # image does not carry every shared library it links against.
      # Real Linux filesystem isolation tests require the runtime's userspace helpers.
      # No kernel policy changes or privileged helper installation happen in the product.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - name: inspect Linux sandbox prerequisites
        run: |
          uname -srmo
          dpkg-query -W bubblewrap socat ripgrep libseccomp2
          for helper in bwrap socat rg; do
            command -v "$helper"
            ldd "$(command -v "$helper")" || true
          done
          ldd node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/x64/apply-seccomp || true
          for setting in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces /proc/self/attr/current; do
            if [ -r "$setting" ]; then
              printf '%s: ' "$setting"
              cat "$setting"
            fi
          done
      - name: prove actual command sandbox startup
        run: pnpm exec vitest run src/daemon/bundled-sandbox.test.ts --maxWorkers=2
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build

  darwin-gates:
    # The darwin-only coverage (launchd plist validation, machine state) on
    # demand. Every release already reruns the full suite on macOS before it
    # publishes, so this is for checking a change between releases.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install chromium-headless-shell
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      # The Mac app's own checks. `desktop/` is its own pnpm root and is not in
      # the install above, so it installs itself here. The smoke is the only one
      # that needs a real Electron: it proves the main process module loads and
      # that the menus it builds are ones Electron accepts, which is what the dmg
      # job used to find out one release late.
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop smoke
