name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      design: ${{ steps.scope.outputs.design }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - id: scope
        run: node --experimental-strip-types .github/scripts/ci-scope.ts

  tests:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # Full containment needs the user/network namespaces available on Ubuntu 22.
    # Ubuntu 24's actual kernel refusal is exercised in restricted-linux-recovery.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ci-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # --with-deps: the browser tests launch headless-shell, and the runner
      # image does not carry every shared library it links against.
      # Real Linux filesystem isolation tests require the runtime's userspace helpers.
      # No kernel policy changes or privileged helper installation happen in the product.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - name: inspect Linux sandbox prerequisites
        run: |
          uname -srmo
          dpkg-query -W bubblewrap socat ripgrep libseccomp2
          for helper in bwrap socat rg; do
            command -v "$helper"
            ldd "$(command -v "$helper")" || true
          done
          ldd node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/x64/apply-seccomp || true
          for setting in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces /proc/self/attr/current; do
            if [ -r "$setting" ]; then
              printf '%s: ' "$setting"
              cat "$setting"
            fi
          done
      - name: prove actual command sandbox startup
        run: pnpm exec vitest run src/daemon/bundled-sandbox.test.ts --maxWorkers=2
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=${{ runner.temp }}/tests.json
        env:
          SPOOL_TEST_EVIDENCE_DIR: ${{ runner.temp }}/spool-delivery
      - name: record installed npm runtime evidence from its shard
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/spool-delivery/installed-npm.json" ]; then
            cat "$RUNNER_TEMP/spool-delivery/installed-npm.json"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/tests.json
          retention-days: 7
          overwrite: true

  quality:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm build

  gates:
    # Publishing requires this full-validation job to have actually succeeded.
    needs: [changes, tests, quality, restricted-linux-recovery]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all test shards, code checks and restricted-host recovery
        env:
          TESTS: ${{ needs.tests.result }}
          QUALITY: ${{ needs.quality.result }}
          RECOVERY: ${{ needs.restricted-linux-recovery.result }}
        run: test "$TESTS" = success && test "$QUALITY" = success && test "$RECOVERY" = success

  darwin-gates:
    # The darwin-only coverage (launchd plist validation, machine state) on
    # demand. Publishing checks the macOS-only cases after full Linux CI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install chromium-headless-shell
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SPOOL_TEST_EVIDENCE_DIR: ${{ runner.temp }}/spool-delivery
      - run: pnpm check
      - run: pnpm build
      # The Mac app's own checks. `desktop/` is its own pnpm root and is not in
      # the install above, so it installs itself here. The smoke is the only one
      # that needs a real Electron: it proves the main process module loads and
      # that the menus it builds are ones Electron accepts, which is what the dmg
      # job used to find out one release late.
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop smoke
      - name: verify the built Mac app with deterministic provider replies
        env:
          SPOOL_TEST_EVIDENCE_DIR: ${{ runner.temp }}/spool-delivery
        run: |
          pnpm pack --out /tmp/spool-delivery.tgz
          SPOOL_TARBALL=/tmp/spool-delivery.tgz desktop/scripts/build.sh
          SPOOL_TEST_APP="$PWD/desktop/release/mac-arm64/Spool.app" pnpm exec vitest run src/installed-engine.test.ts --maxWorkers=1
      - name: record installed Mac runtime evidence
        if: always()
        run: cat "$RUNNER_TEMP/spool-delivery/installed-npm.json" "$RUNNER_TEMP/spool-delivery/installed-app.json"

  restricted-linux-recovery:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # This role requires the actual observed kernel refusal. A successful probe,
    # missing helper, or unrelated error fails instead of silently skipping it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      - name: record the actual restricted host
        run: |
          uname -srmo
          dpkg-query -W bubblewrap socat ripgrep libseccomp2
      - name: verify unavailable isolation and explicit recovery through the installed host
        env:
          SPOOL_TEST_EVIDENCE_DIR: ${{ runner.temp }}/spool-delivery
        run: SPOOL_TEST_RESTRICTED=1 pnpm exec vitest run src/installed-engine.test.ts --maxWorkers=1
      - name: record restricted host evidence
        if: always()
        run: cat "$RUNNER_TEMP/spool-delivery/installed-restricted.json"

  design:
    needs: changes
    if: needs.changes.outputs.design == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/ui/design-parity.test.ts

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop smoke

  ci:
    needs: [changes, tests, quality, gates, design, desktop, darwin-gates, restricted-linux-recovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every selected check to pass
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.JOBS); for (const [name, job] of Object.entries(jobs)) { console.log(`${name}: ${job.result}`); if (job.result !== "success" && job.result !== "skipped") process.exitCode = 1; }'
