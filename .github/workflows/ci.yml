name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR supersedes its older run. Main's runs never
# cancel each other: each commit there may be a release, and publishing waits
# for that exact commit's run to pass.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      design: ${{ steps.scope.outputs.design }}
      desktop: ${{ steps.scope.outputs.desktop }}
      durations: ${{ steps.durations.outputs.durations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - id: scope
        run: node --experimental-strip-types .github/scripts/ci-scope.ts
      # How long each test file took on the last main run, read once here so
      # every shard deals the files out from the same table. Without one the
      # shards guess from file names, and still split the files between them.
      - id: durations
        if: steps.scope.outputs.full == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types .github/scripts/test-shards.ts

  tests:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SPOOL_TEST_DURATIONS: ${{ needs.changes.outputs.durations }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # No --with-deps: the runner image ships Chrome, so the libraries
      # headless-shell links against are there, and the apt step it adds has
      # taken 8 to 15 minutes on a slow Ubuntu mirror.
      - run: pnpm exec playwright-core install chromium-headless-shell
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=json --outputFile=${{ runner.temp }}/tests.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/tests.json
          retention-days: 7
          overwrite: true

  quality:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm build

  gates:
    # Publishing requires this full-validation job to have actually succeeded.
    needs: [changes, tests, quality]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all test shards and code checks
        env:
          TESTS: ${{ needs.tests.result }}
          QUALITY: ${{ needs.quality.result }}
        run: test "$TESTS" = success && test "$QUALITY" = success

  darwin-gates:
    # The darwin-only coverage (launchd plist validation, machine state) on
    # demand. Publishing checks the macOS-only cases after full Linux CI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # the suite alone takes 13 to 14 minutes on a hosted Mac
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install chromium-headless-shell
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      # The Mac app's own checks. `desktop/` is its own pnpm root and is not in
      # the install above, so it installs itself here. The smoke is the only one
      # that needs a real Electron: it proves the main process module loads and
      # that the menus it builds are ones Electron accepts, which is what the dmg
      # job used to find out one release late.
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop smoke

  design:
    needs: changes
    if: needs.changes.outputs.design == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/ui/design-parity.test.ts

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop smoke

  ci:
    needs: [changes, tests, quality, gates, design, desktop, darwin-gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every selected check to pass
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.JOBS); for (const [name, job] of Object.entries(jobs)) { console.log(`${name}: ${job.result}`); if (job.result !== "success" && job.result !== "skipped") process.exitCode = 1; }'
