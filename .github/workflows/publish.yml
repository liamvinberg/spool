name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (recovery for a release whose publish was refused)"
        required: true
        type: string

# Queue runs instead of cancelling: a run may be mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'liamvinberg/spool' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # `changeset tag` only tags and cuts the GitHub release; npm publish
      # happens in the gated job below, from the frozen tag.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset tag
          commit: "release: version spool.page"
          title: "release: spool.page"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.changesets.outputs.published == 'true'
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # The action's title input is static and its body opens with bot
      # boilerplate; name the PR after the version it proposes and keep
      # only the releases. Reapplied after every action update.
      - if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=${{ steps.changesets.outputs.pullRequestNumber }}
          version=$(gh api "repos/${{ github.repository }}/contents/package.json?ref=changeset-release/main" --jq .content | base64 -d | jq -r .version)
          gh pr edit "$pr" --title "release: spool.page $version"
          gh pr view "$pr" --json body -q .body | sed -n '/^# Releases/,$p' | gh pr edit "$pr" --body-file -

  publish:
    needs: release
    if: ${{ !cancelled() && github.repository == 'liamvinberg/spool' && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch') }}
    # macOS: the release gate reruns the darwin-only coverage ci.yml skips.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no token secret anywhere
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The darwin-only coverage, which is the whole reason this gate is on macOS: five
      # tests the linux job skips, in three files. It used to run all 150, and that is
      # what kept releases from going out — four consecutive attempts each failed on a
      # different timing-sensitive browser test, none of them darwin-specific, while
      # 2,284 of 2,287 passed every time. The rest of the suite is linux's to prove and
      # it does, on the same commit, on every push; what belongs here is only what linux
      # cannot run. Merge a release on a green main and this gate is the last mile.
      - run: pnpm vitest run src/autostart.test.ts src/cli.test.ts src/machine-state.test.ts
      - run: pnpm check
      # trusted publishing needs npm >= 11.5.1; node 22 ships npm 10
      - run: npm install -g npm@11
      - run: npm publish

  # The macOS app (#63). It bundles the spool package of its own version, so it
  # can only be built once that version is on npm, which is why this job is last
  # and why it depends on the one above rather than racing it. A failure here
  # cannot retract anything: npm already has the release and the GitHub release
  # already exists, and all that is missing is a file attached to it. Rerun it
  # the same way a refused publish is rerun, with
  # `gh workflow run publish.yml -f tag=vX.Y.Z` — this job does not need the
  # publish step to have succeeded on that rerun, only for the version to be on
  # npm, which by then it is.
  dmg:
    needs: [release, publish]
    if: ${{ !cancelled() && github.repository == 'liamvinberg/spool' && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch') }}
    # Pinned rather than macos-latest: this is the only job that signs and
    # notarizes, and moving Xcode under it unannounced is not worth the surprise
    # on a release day.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      # One version number: the tag, package.json, the npm artifact inside the
      # bundle and CFBundleShortVersionString. An installed copy compares itself
      # against the newest release tag, and that comparison is worth nothing if
      # the two came from different places.
      - run: desktop/scripts/version.sh "$TAG"
      # A keychain that exists for this run only. The certificate arrives as a
      # base64 .p12 and never touches the disk in any other form. The identity is
      # read back out rather than named in a secret, so there is nothing to keep
      # in step when the certificate is renewed.
      - id: identity
        name: Import the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE is not set. See desktop/README.md for the wizard that sets all five." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Without this, codesign stops for a UI prompt nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          # `|| true` so that finding none is answered by the count below rather
          # than by grep's exit code killing the step without saying anything.
          identity=$(security find-identity -v -p codesigning "$keychain" | { grep "Developer ID Application" || true; } | sed -n 's/.*"\(.*\)".*/\1/p')
          if [ "$(printf '%s\n' "$identity" | grep -c .)" != "1" ]; then
            echo "Expected exactly one Developer ID Application identity in the keychain, found:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      # The app's own checks: the daemon.json shape, the address rules, the
      # version comparison, and one real Electron launch that proves the main
      # process module loads. `desktop/` is its own pnpm root, so it installs
      # itself rather than riding a root install.
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop smoke
      - name: Build, sign, notarize, staple
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -z "$NOTARY_KEY_P8" ]; then
            echo "NOTARY_KEY is not set, so this would build a dmg Gatekeeper refuses. See desktop/README.md." >&2
            exit 1
          fi
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" OUT="$RUNNER_TEMP/dist" desktop/scripts/package.sh
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Attach the dmg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          dmg="$RUNNER_TEMP/dist/Spool-$version.dmg"
          sum=$(shasum -a 256 "$dmg" | cut -d " " -f 1)

          # The same file twice, under two names. The versioned one is what you
          # keep and check a hash against. The plain one exists so that
          # releases/latest/download/Spool.dmg is a link that never has to be
          # edited again: GitHub resolves it to whatever the newest release is,
          # but only if the file is named the same every time.
          cp "$dmg" "$RUNNER_TEMP/dist/Spool.dmg"

          gh release upload "$TAG" \
            "$dmg" \
            "$RUNNER_TEMP/dist/Spool.dmg" \
            --clobber

          {
            echo "### Spool for macOS"
            echo
            echo "Apple silicon, macOS 14 or later. Signed and notarized, so it opens without a right-click. Drag it to Applications and open it: the canvas is in the window, and there is a menu bar item for when the window is closed. It brings its own copy of \`spool.page@$version\`, so nothing else has to be installed."
            echo
            echo "\`Spool-$version.dmg\` sha256 \`$sum\`"
            echo
            echo "\`Spool.dmg\` is the same file under a name that does not move, for anything linking to the newest release."
          } > "$RUNNER_TEMP/dmg-notes.md"
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/notes.md"
          printf '\n' >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/dmg-notes.md" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
