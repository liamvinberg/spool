name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm (recovery for a release whose publish was refused)"
        required: true
        type: string

# Queue runs instead of cancelling: a run may be mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'liamvinberg/spool' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # `changeset tag` only tags and cuts the GitHub release; npm publish
      # happens in the gated job below, from the frozen tag.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset tag
          commit: "release: version spool.page"
          title: "release: spool.page"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.changesets.outputs.published == 'true'
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: ${{ !cancelled() && github.repository == 'liamvinberg/spool' && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch') }}
    # macOS: the release gate reruns the darwin-only coverage ci.yml skips.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no token secret anywhere
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install chromium-headless-shell
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check
      # trusted publishing needs npm >= 11.5.1; node 22 ships npm 10
      - run: npm install -g npm@11
      - run: npm publish
