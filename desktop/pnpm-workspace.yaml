# This folder is its own pnpm root, not a member of the repo's workspace.
# See README.md: a root `pnpm install` must not pull Electron down.
# Hoisted, not pnpm's symlink forest: electron-builder walks a real
# node_modules tree to pack production dependencies, and the symlinked layout
# comes back empty ("no node modules returned"), silently shipping an app
# without its runtime deps.
nodeLinker: hoisted
allowBuilds:
  electron: true
  electron-winstaller: false
overrides:
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2 <2.1.7: ^2.1.7
  brace-expansion@>=5 <5.0.12: ^5.0.12
  fast-uri@<3.1.9: ^3.1.9
  js-yaml@>=4 <4.3.2: ^4.3.2
  undici@>=6 <6.29.1: ^6.29.1
  undici@>=7 <7.30.1: ^7.30.1
