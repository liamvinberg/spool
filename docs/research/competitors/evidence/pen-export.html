<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body style="background-color: #FFFFFF">
    <div
      data-pencil-name="Reading list"
      style="align-items: flex-start; background-color: #FFFFFF; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; height: 600px; justify-content: flex-start; overflow: hidden; padding: 24px; width: 320px"
    >
      <div
        data-pencil-name="Title"
        style="box-sizing: border-box; color: #151515; font-family: Inter, system-ui, sans-serif; font-size: 24px; font-style: normal; font-weight: 600; letter-spacing: 0px; line-height: normal; text-align: left; width: 100%"
      >
        Reading list
      </div>
      <div
        data-pencil-name="Responsive card"
        style="align-items: flex-start; background-color: #F3F4F6; border-radius: 8px; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0; gap: 24px; height: fit-content; justify-content: flex-start; padding: 24px; width: 100%"
      >
        <div
          data-pencil-name="Image placeholder"
          style="background-image: url('sample.png'); background-position: center; background-repeat: no-repeat; background-size: cover; box-sizing: border-box; flex-shrink: 0; height: 100px; width: 100%"
        ></div>
        <div
          data-pencil-name="Card title"
          style="box-sizing: border-box; color: #151515; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; width: 100%"
        >
          longer story about making time for the books you want to read
        </div>
        <div
          data-pencil-name="Save instance"
          style="align-items: flex-start; background-color: #2457E6; border-radius: 8px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: fit-content; justify-content: flex-start; padding: 12px 24px; width: fit-content"
        >
          <div
            data-pencil-name="Button label"
            style="box-sizing: border-box; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
          >
            Save
          </div>
        </div>
      </div>
      <div
        data-pencil-name="Second instance"
        style="align-items: flex-start; background-color: #2457E6; border-radius: 8px; box-sizing: border-box; display: flex; flex-direction: row; flex-shrink: 0; gap: 0px; height: fit-content; justify-content: flex-start; padding: 12px 24px; width: fit-content"
      >
        <div
          data-pencil-name="Button label"
          style="box-sizing: border-box; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 16px; font-style: normal; font-weight: 400; letter-spacing: 0px; line-height: normal; text-align: left; white-space: nowrap"
        >
          Keep reading
        </div>
      </div>
    </div>
  </body>
</html>
