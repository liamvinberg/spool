<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play loader prototype</title>
<meta name="description" content="Throwaway prototype: five ways the play window can load, at warm, after-edit and cold speeds.">
<style>
@font-face { font-family: "Fragment Mono"; src: url(fragment-mono.woff2) format("woff2"); }
:root { --thread: #f5391a; --page: #0e0e0e; --bar: #282828; --line: #363636; --hint: #94918d; --ink: #f0efed; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #070707; color: var(--ink); font: 400 12px/18px "Fragment Mono", ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
body { display: grid; place-items: center; overflow: hidden; }

/* the stand-in for the Mac app's play window, scaled to fit */
#fit { position: absolute; inset: 0 0 120px; }
.win { position: relative; width: 1200px; height: 830px; background: var(--page); border-radius: 10px; overflow: hidden; outline: 1px solid #2a2a2a; position: absolute; left: 50%; top: 50%; transform-origin: center; }
.top { position: absolute; inset: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 76px; background: var(--bar); border-bottom: 1px solid var(--line); z-index: 5; }
.lights { position: absolute; left: 12px; top: 9px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.top .project { color: var(--hint); }
.top .end { margin-left: auto; display: flex; gap: 12px; color: var(--hint); font-size: 11px; }
.top .loading { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.stage { position: absolute; inset: 30px 0 0; overflow: hidden; }
.screen { position: absolute; top: 0; bottom: 0; left: 50%; translate: -50% 0; }
.live, .cover { position: absolute; inset: 0; }

/* the frame being played: a stand-in prototype */
.proto { position: absolute; inset: 0; background: #fff; color: #111; font: 15px/1.5 -apple-system, "Inter", system-ui, sans-serif; overflow: hidden; }
.proto nav { display: flex; align-items: center; gap: 28px; padding: 22px 48px; border-bottom: 1px solid #eee; font-size: 14px; color: #555; }
.proto nav b { color: #111; margin-right: auto; font-size: 16px; }
.proto .hero { padding: 88px 48px 0; max-width: 760px; }
.proto h1 { font-size: 54px; line-height: 1.04; letter-spacing: -1.6px; margin: 0 0 20px; font-weight: 650; }
.proto p { color: #555; font-size: 18px; margin: 0 0 32px; max-width: 520px; }
.proto .cta { display: inline-block; background: #111; color: #fff; padding: 13px 22px; border-radius: 8px; font-size: 15px; }
.proto .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 72px 48px; }
.proto .tile { height: 180px; border-radius: 12px; background: #f3f2ef; }
.proto .tile:nth-child(2) { background: #ffe9e2; }
.phone .proto nav { padding: 18px 20px; gap: 0; } .phone .proto nav span { display: none; }
.phone .proto .hero { padding: 48px 20px 0; } .phone .proto h1 { font-size: 36px; letter-spacing: -1px; }
.phone .proto p { font-size: 16px; } .phone .proto .row { grid-template-columns: 1fr; padding: 40px 20px; } .phone .proto .tile { height: 120px; }

/* shared pieces */
.thread-line { position: absolute; top: 0; left: 0; right: 0; height: 1px; overflow: hidden; z-index: 4; opacity: 0; transition: opacity 200ms ease; }
.thread-line::after { content: ""; position: absolute; top: 0; width: 120px; height: 1px; background: var(--thread); animation: run 1.6s cubic-bezier(.65,0,.35,1) infinite alternate; }
@keyframes run { from { left: -120px; } to { left: 100%; } }
.status { position: absolute; left: 0; right: 0; top: 50%; translate: 0 -50%; text-align: center; z-index: 3; opacity: 0; transition: opacity 240ms ease; pointer-events: none; }
.status .name { color: var(--ink); }
.status .sub { color: var(--hint); font-size: 11px; margin-top: 4px; }

/* ---- variant: today (what ships) ---- */
.v-today .screen { background: #fff; }
.v-today .live { opacity: 0; }
.v-today.ready .live { opacity: 1; }

/* ---- variant: quiet ---- */
.v-quiet .live { opacity: 0; transition: opacity 180ms ease-out; }
.v-quiet.ready .live { opacity: 1; }
.v-quiet.slow:not(.ready) .thread-line { opacity: 1; }
.v-quiet.slow:not(.ready) .status.late { opacity: 1; }

/* ---- variant: thread (the frame's edge is traced while it composes) ---- */
.trace { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 2; pointer-events: none; }
.trace rect { fill: none; vector-effect: non-scaling-stroke; }
.trace .rail { stroke: #2c2c2c; stroke-width: 1; opacity: 0; transition: opacity 300ms ease; }
.trace .run { stroke: var(--thread); stroke-width: 1.5; stroke-dasharray: .18 .82; stroke-linecap: round; opacity: 0; transition: opacity 300ms ease; animation: trace 2.4s linear infinite; }
@keyframes trace { to { stroke-dashoffset: -1; } }
.v-thread .live { opacity: 0; transition: opacity 260ms ease-out, scale 360ms cubic-bezier(.2,.8,.2,1); scale: .985; }
.v-thread.ready .live { opacity: 1; scale: 1; }
.v-thread.slow:not(.ready) .rail, .v-thread.slow:not(.ready) .run { opacity: 1; }
.v-thread.slow:not(.ready) .status { opacity: 1; }
.v-thread.ready .run { animation: close 380ms ease-out forwards; opacity: 0; transition: opacity 380ms ease 120ms; }
@keyframes close { to { stroke-dasharray: 1 0; } }

/* ---- variant: winding (the mark winds its thread) ---- */
.mark { position: absolute; left: 50%; top: 50%; width: 52px; translate: -50% -78%; z-index: 3; opacity: 0; transition: opacity 240ms ease; overflow: visible; }
.mark path { fill: var(--thread); transform-box: fill-box; transform-origin: left center; scale: 0 1; }
.v-winding.slow:not(.ready) .mark { opacity: 1; }
.v-winding.slow:not(.ready) .mark path { animation: wind 2.8s cubic-bezier(.6,0,.2,1) infinite; animation-delay: calc(var(--i) * 110ms); }
@keyframes wind { 0% { scale: 0 1; transform-origin: left center; } 32% { scale: 1 1; transform-origin: left center; } 68% { scale: 1 1; transform-origin: right center; } 92%, 100% { scale: 0 1; transform-origin: right center; } }
.v-winding .status { translate: 0 30px; }
.v-winding.slow:not(.ready) .status { opacity: 1; }
.v-winding .live { opacity: 0; transition: opacity 220ms ease-out; }
.v-winding.ready .live { opacity: 1; }

/* ---- variant: cover (the frame's canvas still paints at once) ---- */
.v-cover .cover { opacity: .5; filter: grayscale(.35); transition: opacity 200ms ease; }
.v-cover .live { opacity: 0; transition: opacity 160ms ease-out; }
.v-cover.ready .live { opacity: 1; }
.v-cover.slow:not(.ready) .thread-line { opacity: 1; }
.v-cover:not(.ready) .stage { cursor: progress; }

.cover { display: none; } .v-cover .cover { display: block; }
.trace { display: none; } .v-thread .trace { display: block; }
.mark { display: none; } .v-winding .mark { display: block; }
.v-today .thread-line, .v-today .status, .v-winding .thread-line, .v-thread .thread-line { display: none; }
.v-cover .status { display: none; }
.v-quiet .status:not(.late) { display: none; }
.status.late { display: none; } .v-quiet .status.late { display: block; translate: 0 -50%; }

@media (max-width: 700px) { .dock { gap: 4px; padding: 8px; } .dock .k { width: 44px; } .dock .note { font-size: 10px; line-height: 14px; } }
@media (prefers-reduced-motion: reduce) { .thread-line::after, .trace .run, .mark path, .top .loading { animation: none !important; } .mark path { scale: 1 1 !important; } }

/* the switcher: flat, out of the way */
.dock { position: fixed; left: 50%; bottom: 16px; translate: -50% 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; width: min(760px, calc(100vw - 24px)); z-index: 20; }
.dock .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.dock .k { color: var(--hint); width: 56px; font-size: 11px; }
.dock button { font: inherit; font-size: 11px; color: var(--hint); background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.dock button:hover { color: var(--ink); }
.dock button[aria-pressed="true"] { color: var(--ink); border-color: #3a3a3a; background: #1f1f1f; }
.dock .replay { margin-left: auto; color: var(--ink); border-color: #3a3a3a; }
.dock .clock { color: var(--hint); font-size: 11px; min-width: 150px; text-align: right; }
.dock .note { color: var(--hint); font-size: 11px; line-height: 16px; }
</style>
</head>
<body>
<div id="fit">
	<div class="win" id="win">
		<div class="top">
			<span class="lights"><i></i><i></i><i></i></span>
			<span><span class="project">site / </span>waitlist</span>
			<span class="end"><span class="loading" id="barLoading">loading</span><span id="size">1200 × 800</span></span>
		</div>
		<div class="stage" id="stage">
			<div class="thread-line"></div>
			<div class="status late"><div class="sub" id="lateSub">composing 454 frames</div></div>
			<div class="status"><div class="name" id="statusName">site/waitlist</div><div class="sub" id="statusSub">composing 454 frames</div></div>
			<svg class="mark" viewBox="250 182 524 660" id="mark" aria-hidden="true"></svg>
			<div class="screen" id="screen">
				<svg class="trace" preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true"><rect class="rail" x="0" y="0" width="100" height="100" pathLength="1"/><rect class="run" x="0" y="0" width="100" height="100" pathLength="1"/></svg>
				<div class="cover"><div class="proto" id="coverProto"></div></div>
				<div class="live"><div class="proto" id="liveProto"></div></div>
			</div>
		</div>
	</div>
</div>

<div class="dock">
	<div class="group" id="variants"><span class="k">loader</span></div>
	<div class="group" id="speeds"><span class="k">speed</span></div>
	<div class="group" id="frames"><span class="k">frame</span><button class="replay" id="replay">replay</button><span class="clock" id="clock"></span></div>
	<div class="note" id="note"></div>
</div>

<script>

357.261, 711.092 349.293, 725.482 339.332 C 731.359 335.263, 733.347 333.075, 738.053 325.499 C 749.045 307.803, 753.246 298.643, 747.405 305.109 M 691.500 385.164 C 683.239 391.415, 664.871 399.405, 642.982 406.269 C 628.165 410.915, 607.464 416.356, 577.500 423.482 C 535.145 433.554, 511.948 439.722, 492.760 446.013 C 482.454 449.392, 473.857 452.459, 473.657 452.829 C 473.456 453.198, 478.797 457.136, 485.524 461.580 L 497.756 469.659 516.128 464.822 C 526.233 462.161, 543.050 457.713, 553.500 454.936 C 622.050 436.724, 655.594 422.010, 679.657 399.597 C 686.502 393.221, 697.017 381.834, 695.843 382.068 C 695.654 382.106, 693.700 383.499, 691.500 385.164 M 612 464.112 C 603.330 470.038, 586.059 477.959, 554.415 490.522 C 491.638 515.447, 468.318 529.030, 445.329 554.063 L 439.500 560.409 445.793 555.212 C 453.360 548.963, 467.539 540.490, 480.491 534.479 C 485.715 532.054, 500.678 525.506, 513.744 519.926 C 540.081 508.680, 567.547 495.260, 581.905 486.624 C 595.158 478.653, 619.176 461.157, 617 461.059 C 616.725 461.046, 614.475 462.420, 612 464.112 M 511.500 559.732 C 507.650 561.149, 496.689 565.170, 487.143 568.666 C 436.273 587.298, 411.340 601.499, 380.627 629.334 C 377.141 632.494, 378.489 632.016, 384.500 627.962 C 396.878 619.613, 418.617 611.318, 460.264 599.053 C 477.079 594.101, 496.837 588.068, 504.169 585.645 C 522.326 579.647, 542.069 571.706, 541.685 570.556 C 541.269 569.308, 521.097 556.978, 519.635 557.078 C 519.011 557.120, 515.350 558.315, 511.500 559.732 M 540 615.120 C 524.656 620.625, 491.990 628.702, 441.500 639.475 C 406.276 646.990, 396.912 649.402, 378.579 655.682 C 362.653 661.137, 347.105 668.998, 336.567 676.924 C 328.202 683.215, 312.964 697.757, 307.671 704.500 L 304.532 708.500 308.309 705.243 C 313.108 701.104, 321.090 697.079, 332.421 693.082 C 351.893 686.214, 372.922 681.639, 413 675.550 C 494.043 663.238, 530.838 655.853, 563.077 645.431 C 569.085 643.489, 574 641.397, 574 640.783 C 574 639.315, 547.908 612.978, 546.548 613. const variants = [
	["today", "today", "What ships: the screen behind the hidden frame is white, the bar pulses loading, the frame pops in."],
	["quiet", "quiet", "Dark stage. Under 300ms nothing shows at all, then the frame fades in. Slower than that, a thread runs under the bar and a line says what it is doing."],
	["thread", "thread", "After 300ms a thread runs around the frame's own edge, at its real size, so you see the shape you are about to get. Ready: the thread closes and the frame grows in."],
	["winding", "winding", "After 300ms the spool mark winds its thread, band by band, with the frame's name under it. The most branded, and the loudest."],
	["cover", "cover", "The frame's canvas still (the booth already has one) paints at once, dimmed, so it never feels empty. It goes live when ready. Clicks before then do nothing, which is the cost."],
];
const speeds = [
	["warm", 250, "warm 0.25s", "warm (canvas open a while)"],
	["edit", 700, "after edit 0.7s", "right after an edit"],
	["cold", 13200, "cold 13s", "cold (first play, 454-frame project)"],
];
const frames = [["desktop", "desktop 1200"], ["phone", "phone 390, wide window"]];
const params = new URLSearchParams(location.search);
let variant = params.get("variant") ?? "thread";
let speed = params.get("speed") ?? "edit";
let frame = params.get("frame") ?? "desktop";

const $ = (id) => document.getElementById(id);
const win = $("win");

// the mark, split into its bands so each can wind on its own
$("mark").innerHTML = MARK.split(/ (?=M )/).map((d, i) => `<path d="${d}" style="--i:${i}"/>`).join("");

const protoHtml = `<nav><b>Loom</b><span>Product</span><span>Pricing</span><span>Sign in</span></nav>
<div class="hero"><h1>You're on the list.</h1><p>We'll write the moment your seat opens. Until then, here is what is coming.</p><span class="cta">Share your invite link</span></div>
<div class="row"><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>`;
$("coverProto").innerHTML = protoHtml;
$("liveProto").innerHTML = protoHtml;

function buttons(container, list, current, set) {
	const el = $(container);
	for (const [key, label] of list) {
		const b = document.createElement("button");
		b.textContent = label;
		b.dataset.key = key;
		b.onclick = () => { set(key); sync(); play(); };
		el.insertBefore(b, el.querySelector(".replay"));
	}
}
buttons("variants", variants, variant, (k) => (variant = k));
buttons("speeds", speeds.map(([k, , l]) => [k, l]), speed, (k) => (speed = k));
buttons("frames", frames, frame, (k) => (frame = k));
$("replay").onclick = play;

function sync() {
	for (const b of document.querySelectorAll(".dock button[data-key]")) {
		const k = b.dataset.key;
		b.setAttribute("aria-pressed", String(k === variant || k === speed || k === frame));
	}
	$("note").textContent = variants.find(([k]) => k === variant)[2];
	const p = new URLSearchParams({ variant, speed, frame });
	history.replaceState(null, "", `?${p}`);
	const phone = frame === "phone";
	win.classList.toggle("phone", phone);
	$("screen").style.width = phone && !narrow ? "390px" : "100%";
	$("size").textContent = narrow ? "" : "1200 × 800";
	const name = phone ? "app/onboarding" : "site/waitlist";
	$("statusName").textContent = name;
	win.querySelector(".top > span:nth-child(2)").innerHTML = phone ? '<span class="project">app / </span>onboarding' : '<span class="project">site / </span>waitlist';
	fit();
}

let timers = [];
let raf = 0;
function play() {
	timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
	win.className = `win v-${variant}${frame === "phone" ? " phone" : ""}`;
	// restart animations so every replay starts from nothing
	void win.offsetWidth;
	const ms = speeds.find(([k]) => k === speed)[1];
	const cold = speed === "cold";
	$("statusSub").textContent = cold ? "composing 454 frames" : "loading";
	$("lateSub").textContent = cold ? "composing 454 frames" : "loading";
	$("barLoading").style.display = variant === "today" ? "" : "none";
	const sw = $("screen").offsetWidth, sh = $("screen").offsetHeight;
	const svg = win.querySelector(".trace");
	svg.setAttribute("viewBox", `0 0 ${sw} ${sh}`);
	for (const r of svg.querySelectorAll("rect")) { r.setAttribute("x", 1); r.setAttribute("y", 1); r.setAttribute("width", sw - 2); r.setAttribute("height", sh - 2); }
	const t0 = performance.now();
	timers.push(setTimeout(() => win.classList.add("slow"), 300));
	timers.push(setTimeout(() => { win.classList.add("ready"); $("barLoading").style.display = "none"; }, ms));
	const tick = () => {
		const t = (performance.now() - t0) / 1000;
		const done = t * 1000 >= ms;
		$("clock").textContent = done ? `live at ${(ms / 1000).toFixed(2)}s` : `loading ${t.toFixed(1)}s`;
		if (!done) raf = requestAnimationFrame(tick);
	};
	tick();
}

// on a phone the window is a phone frame's own window: 390 wide, the frame filling it
const narrow = matchMedia("(max-width: 700px)").matches;
const W = narrow ? 390 : 1200, H = narrow ? 874 : 830;
if (narrow) { win.style.width = W + "px"; win.style.height = H + "px"; frame = "phone"; document.getElementById("frames").querySelectorAll("button[data-key]").forEach((b) => b.remove()); }
function fit() {
	$("fit").style.bottom = `${document.querySelector(".dock").offsetHeight + 24}px`;
	const box = $("fit").getBoundingClientRect();
	const s = Math.min((box.width - 24) / W, (box.height - 24) / H, 1);
	win.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit);
sync();
play();
</script>
</body>
</html>
